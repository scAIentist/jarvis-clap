[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-clap"
version = "1.0.0"
description = "Double-clap to launch Claude Code — Tony Stark style."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["jarvis", "claude", "iron-man", "voice-activation", "clap-detection", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]

[project.scripts]
jarvis = "clap_launcher:main"
